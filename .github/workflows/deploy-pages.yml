name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "confidential-pooltogether/frontend/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: confidential-pooltogether/frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: confidential-pooltogether/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build -- --base=/confidential-pool/

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload frontend artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: confidential-pooltogether/frontend/dist

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v5
